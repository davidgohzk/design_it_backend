services:
  - type: web
    # Kept as the existing service name: renaming a Blueprint service creates a second service.
    name: design_it
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SOCLAAS_API_KEY
        sync: false
      - key: SOCLAAS_MODEL
        sync: false
      - key: SOCLAAS_BASE_URL
        value: https://soclaas-api.comp.nus.edu.sg/v1
      - key: ALLOWED_ORIGINS
        value: "*"
